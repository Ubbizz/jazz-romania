<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazz FM Romania</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./provandoacapire.css">
</head>

<body>
    <header class="yellow-bg">
        <div class="container-fluid">
            <div class="row">
                <div class="col-5 col-md-2">
                    <a class="logo" href="/" title="Jazz FM Romania">
                        <img class="img-fluid w-100" src="./assets/assets_logo.svg" alt="Jazz FM Romania"></a>
                </div>
                <div id="play" class="control-btn play">
                    <img class="img-fluid play-icon" src="./assets/assets_play.svg" alt="">
                    <!-- <img class="img-fluid stop-icon" src="./assets/assets_stop-2.svg" alt=""> -->
                </div>
                <div class="col-12 col-md-6 aling-self-end meta-info">
                    <div class="label">Now Playing</div>
                    <div id="artist">Jazz FM Romania</div>
                    <div id="song">Daily playlist (25)</div>
                </div>
            </div>
        </div>
    </header>
    <div class="container-fluid">
        <div class="row ilu purple-bk">
            <div class="col-12"><img src="./assets/assets_illu1_remake.svg"></div>
        </div>
    </div>
    <div class="how-to yellow-bg">
        <div class="container-fluid">
            <div class="row step">
                <div class="col-12 col-md-8">
                    <div class="big-title">
                        <h2>How to<br>
                            listen<br>
                            to
                        </h2>
                    </div>
                    <div class="row">
                        <div class="col-8"><img class="img-fluid letter mt-25" src="./assets/assets_letters-j.svg" alt=""></div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <!-- <div class="bullet-big d-none d-md-block"></div> ??? -->
                     <div class="schedule mt_19">
                        <h3 class="f_11">
                            <span class="no">1</span>FM
                        </h3>
                     </div>
                     <div class="table-schedule">
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                        <div class="row-schedule"></div>
                     </div>
                </div>
            </div>
            <div class="row pb-2040"></div>
            <div class="row step"></div>
        </div>
    </div>

</body>

</html>
